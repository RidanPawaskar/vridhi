<!doctype html>

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <meta name="theme-color" content="#3b82f6" />
  <title>Vridhi</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/vridhi/assets/CQ2ikFG_.svg">
  <!-- Start Single Page Apps for GitHub Pages -->
  <script type="text/javascript">
    (function (l) {
      if (l.search[1] === 'p') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&')
        }).filter(function (v) {
          return v.indexOf('p=/') === 0;
        })[0].slice(2);
        if (decoded !== l.pathname) {
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + (l.search.indexOf('&q=') !== -1 ? '?' + l.search.slice(l.search.indexOf('&q=') + 3).replace(/~and~/g, '&') : '') + l.hash
          );
        }
      }
    }(window.location))
  </script>
  <!-- End Single Page Apps for GitHub Pages -->
  <script type="module" crossorigin src="/vridhi/assets/DBT9T-4E.js"></script>
  <link rel="stylesheet" crossorigin href="/vridhi/assets/DFn4BQy3.css">
</head>

<body>
  <div id="root"></div>

</body>

</html>
